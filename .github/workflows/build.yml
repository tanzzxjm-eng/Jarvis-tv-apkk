name: Build JARVIS FIX
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: android-actions/setup-android@v3
      - run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p app/src/main/java/com/bostanz/jarvis
          echo "include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.1.0' apply false } task wrapper(type: Wrapper) { gradleVersion = '8.0' }" > build.gradle
          echo "plugins { id 'com.android.application' } android { namespace 'com.bostanz.jarvis'; compileSdk 34; defaultConfig { applicationId 'com.bostanz.jarvis'; minSdk 21; targetSdk 34; versionCode 6; versionName '6.0' } compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } } dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }" > app/build.gradle
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.INTERNET"/><application android:label="JARVIS TV" android:theme="@android:style/Theme.NoTitleBar.Fullscreen"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          printf 'package com.bostanz.jarvis; import android.app.Activity; import android.content.Intent; import android.content.pm.PackageManager; import android.graphics.*; import android.os.Bundle; import android.speech.*; import android.speech.tts.TextToSpeech; import android.view.*; import java.util.*; public class MainActivity extends Activity implements TextToSpeech.OnInitListener, RecognitionListener { TextToSpeech tts; SpeechRecognizer sr; String status="STANDBY BOS"; String jam="00:00"; float putaran=0; boolean listening=false; class HUD extends View { Paint p=new Paint(); public HUD(Activity c){super(c); p.setAntiAlias(true);} protected void onDraw(Canvas c){ c.drawColor(Color.BLACK); putaran+=1.5f; int cx=getWidth()/2; int cy=getHeight()/2-40; p.setColor(Color.argb(30,0,255,255)); p.setStyle(Paint.Style.STROKE); p.setStrokeWidth(2); c.drawCircle(cx,cy,300,p); p.setColor(listening?Color.GREEN:Color.CYAN); p.setStrokeWidth(7); c.drawCircle(cx,cy,210,p); c.drawArc(cx-210,cy-210,cx+210,cy+210, putaran, 120, false, p); p.setColor(Color.WHITE); p.setStrokeWidth(4); c.drawArc(cx-170,cy-170,cx+170,cy+170, -putaran*1.5f, 80, false, p); p.setStyle(Paint.Style.FILL); p.setColor(Color.CYAN); p.setTextSize(90); p.setTypeface(Typeface.DEFAULT_BOLD); p.setTextAlign(Paint.Align.CENTER); c.drawText("JARVIS", cx, cy+150, p); p.setTextSize(24); p.setColor(listening?Color.GREEN:Color.WHITE); c.drawText(status, cx, cy+190, p); p.setTextSize(26); p.setColor(Color.CYAN); p.setTextAlign(Paint.Align.RIGHT); c.drawText(jam, getWidth()-30, 55, p); p.setTextAlign(Paint.Align.LEFT); p.setTextSize(20); p.setColor(Color.GRAY); c.drawText("REMOTE: [OK]=NGOMONG", 30, getHeight()-35, p); postInvalidateDelayed(16); } } HUD hud; public void onCreate(Bundle b){ super.onCreate(b); getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON); hud=new HUD(this); setContentView(hud); tts=new TextToSpeech(this,this); new Timer().scheduleAtFixedRate(new TimerTask(){public void run(){runOnUiThread(()->jam=new java.text.SimpleDateFormat("HH:mm:ss").format(new Date()));}},0,1000); } public void onInit(int i){ tts.setLanguage(new Locale("id","ID")); tts.speak("Jarvis TV siap Bos",0,null,null); } public boolean onKeyDown(int k, KeyEvent e){ if(k==KeyEvent.KEYCODE_DPAD_CENTER||k==KeyEvent.KEYCODE_ENTER){ mulai(); return true; } if(k==KeyEvent.KEYCODE_BACK){finish(); return true;} return super.onKeyDown(k,e); } void mulai(){ if(SpeechRecognizer.isRecognitionAvailable(this)){ if(sr!=null) sr.destroy(); sr=SpeechRecognizer.createSpeechRecognizer(this); sr.setRecognitionListener(this); Intent intent=new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH); intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE,"id-ID"); sr.startListening(intent); listening=true; status="DENGERIN BOS..."; } } public void onResults(Bundle r){ listening=false; ArrayList<String> res=r.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION); if(res==null||res.isEmpty()){status="GAK DENGER, OK LAGI"; return;} String h=res.get(0).toLowerCase(); status=h.toUpperCase(); if(h.contains("youtube")||h.contains("yutub")){ tts.speak("Buka YouTube Bos",0,null,null); buka("com.google.android.youtube.tv","com.google.android.youtube");} else if(h.contains("netflix")){ tts.speak("Buka Netflix Bos",0,null,null); buka("com.netflix.ninja","com.netflix.mediaclient");} else if(h.contains("jam")){ tts.speak("Jam "+jam+" Bos",0,null,null);} else { tts.speak("Ulangi Bos",0,null,null);} } void buka(String p1,String p2){ try{ PackageManager pm=getPackageManager(); Intent a=pm.getLaunchIntentForPackage(p1); if(a==null) a=pm.getLaunchIntentForPackage(p2); if(a!=null) startActivity(a);}catch(Exception e){} } public void onReadyForSpeech(Bundle b){} public void onBeginningOfSpeech(){} public void onRmsChanged(float f){} public void onBufferReceived(byte[] b){} public void onEndOfSpeech(){listening=false;} public void onError(int e){listening=false; status="TEKAN OK LAGI BOS";} public void onPartialResults(Bundle b){} public void onEvent(int a, Bundle b){} }' > app/src/main/java/com/bostanz/jarvis/MainActivity.java
          gradle wrapper --gradle-version 8.0
         ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: JARVIS-TV-FIX, path: app/build/outputs/apk/debug/*.apk }
