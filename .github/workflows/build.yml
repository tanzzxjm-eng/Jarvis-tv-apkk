name: Build JARVIS FIX
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android
        uses: android-actions/setup-android@v3
      - name: Buat Project Native
        run: |
          cat > settings.gradle <<'ENDOFFILE'
          include ':app'
          ENDOFFILE

          cat > build.gradle <<'ENDOFFILE'
          plugins {
            id 'com.android.application' version '8.1.0' apply false
          }
          task wrapper(type: Wrapper) {
            gradleVersion = '8.0'
          }
          ENDOFFILE

          mkdir -p app/src/main/java/com/bostanz/jarvis

          cat > app/build.gradle <<'ENDOFFILE'
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.bostanz.jarvis'
            compileSdk 34
            defaultConfig {
              applicationId "com.bostanz.jarvis"
              minSdk 21
              targetSdk 34
              versionCode 7
              versionName "7.0"
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          ENDOFFILE

          cat > app/src/main/AndroidManifest.xml <<'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="JARVIS TV" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          ENDOFFILE

          cat > app/src/main/java/com/bostanz/jarvis/MainActivity.java <<'ENDOFFILE'
          package com.bostanz.jarvis;
          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.*;
          import android.view.*;
          import android.speech.*;
          import android.speech.tts.TextToSpeech;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import java.util.*;
          public class MainActivity extends Activity implements TextToSpeech.OnInitListener, RecognitionListener {
            TextToSpeech tts; SpeechRecognizer sr; boolean listening=false; String status="STANDBY BOS"; float putaran=0;
            class HUD extends View {
              Paint p=new Paint();
              public HUD(Activity c){super(c); p.setAntiAlias(true);}
              protected void onDraw(Canvas canvas){
                canvas.drawColor(Color.BLACK);
                putaran+=2; int cx=getWidth()/2; int cy=getHeight()/2;
                p.setColor(Color.argb(30,0,255,255)); p.setStyle(Paint.Style.STROKE); p.setStrokeWidth(2);
                canvas.drawCircle(cx,cy,280,p);
                p.setColor(listening?Color.GREEN:Color.CYAN); p.setStrokeWidth(8);
                canvas.drawCircle(cx,cy,200,p);
                p.setStyle(Paint.Style.FILL); p.setColor(Color.CYAN); p.setTextSize(80); p.setTextAlign(Paint.Align.CENTER);
                canvas.drawText("JARVIS",cx,cy+140,p);
                p.setTextSize(22); p.setColor(Color.WHITE);
                canvas.drawText(status,cx,cy+180,p);
                postInvalidateDelayed(16);
              }
            }
            HUD hud;
            public void onCreate(Bundle b){
              super.onCreate(b);
              hud=new HUD(this);
              setContentView(hud);
              tts=new TextToSpeech(this,this);
            }
            public void onInit(int i){
              tts.setLanguage(new Locale("id","ID"));
            }
            public boolean onKeyDown(int k, KeyEvent e){
              if(k==KeyEvent.KEYCODE_DPAD_CENTER||k==KeyEvent.KEYCODE_ENTER){
                mulai(); return true;
              }
              return super.onKeyDown(k,e);
            }
            void mulai(){
              sr=SpeechRecognizer.createSpeechRecognizer(this);
              sr.setRecognitionListener(this);
              Intent intent=new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
              intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE,"id-ID");
              sr.startListening(intent);
              listening=true; status="DENGERIN BOS...";
            }
            public void onResults(Bundle r){
              listening=false;
              ArrayList<String> res=r.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
              if(res==null) return;
              String h=res.get(0).toLowerCase();
              status=h.toUpperCase();
              if(h.contains("youtube")){
                try{startActivity(getPackageManager().getLaunchIntentForPackage("com.google.android.youtube.tv"));}catch(Exception e){}
              }
              if(h.contains("netflix")){
                try{startActivity(getPackageManager().getLaunchIntentForPackage("com.netflix.ninja"));}catch(Exception e){}
              }
            }
            public void onReadyForSpeech(Bundle b){}
            public void onBeginningOfSpeech(){}
            public void onRmsChanged(float f){}
            public void onBufferReceived(byte[] b){}
            public void onEndOfSpeech(){listening=false;}
            public void onError(int e){listening=false; status="TEKAN OK LAGI BOS";}
            public void onPartialResults(Bundle b){}
            public void onEvent(int a, Bundle b){}
          }
          ENDOFFILE

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle wrapper --gradle-version 8.0
         ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-TV-BOS
          path: app/build/outputs/apk/debug/*.apk
